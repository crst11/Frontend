<main class="screen recovery">
  <header class="top-bar">
    <a class="icon-button" routerLink="/cuenta/entrar" aria-label="Volver">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
    </a>
  </header>

  <div class="recovery__intro">
    <div class="recovery__icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2" />
        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
      </svg>
    </div>
    <h1 class="title">¿Olvidaste tu contraseña?</h1>
    <p class="subtitle">Escribe tu correo institucional y te enviamos un código para crear una nueva</p>
  </div>

  <form class="form" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
    <div class="field">
      <label class="field__label" for="correo">Correo institucional</label>
      <app-institutional-email-input inputId="correo" formControlName="correo" [invalid]="invalido()" />
      @if (invalido()) {
        <p class="field__error">Escribe tu usuario del correo institucional.</p>
      }
    </div>

    <button class="button button--primary" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Enviando…' : 'Enviarme el código' }}
    </button>
  </form>

  <p class="recovery__pie">
    ¿Ya la recordaste? <a routerLink="/cuenta/entrar">Inicia sesión</a>
  </p>
</main>
