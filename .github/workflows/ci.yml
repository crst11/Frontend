name: CI

on:
  pull_request:
    branches: [desarrollo, preproduccion, produccion]

jobs:
  verificar:
    name: Instalar, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
