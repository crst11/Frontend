<section class="categories">
  <h1>Guía institucional</h1>

  @if (cargando()) {
    <p>Cargando categorías…</p>
  } @else if (error()) {
    <p role="alert">No se pudieron cargar las categorías. Intenta de nuevo más tarde.</p>
  } @else {
    <ul>
      @for (categoria of categorias(); track categoria.id) {
        <li>{{ categoria.nombre }}</li>
      }
    </ul>
  }
</section>
