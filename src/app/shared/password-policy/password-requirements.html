<ul class="requisitos" aria-label="Requisitos de la contraseña">
  @for (requisito of requisitos(); track requisito.etiqueta) {
    <li class="requisito" [class.requisito--cumplido]="requisito.cumplido">
      <span class="requisito__marca" aria-hidden="true">{{ requisito.cumplido ? '✓' : '○' }}</span>
      <span>{{ requisito.etiqueta }}</span>
      <span class="sr-only">{{ requisito.cumplido ? ': cumplido' : ': falta' }}</span>
    </li>
  }
</ul>
