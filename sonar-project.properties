# Análisis de calidad con SonarQube (SCRUM-255). Sin secretos: el token va en la variable SONAR_TOKEN y el
# servidor en SONAR_HOST_URL (por defecto http://localhost:9000). Cómo correrlo: docs/sonarqube.md.
sonar.projectKey=cundiapp-frontend
sonar.projectName=CundiApp Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src/app,src/environments
sonar.tests=src/app
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/*.e2e.ts

sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.app.json,tsconfig.spec.json
sonar.javascript.lcov.reportPaths=coverage/cundiapp/lcov.info
