name: CI

on:
  pull_request:
    branches: [desarrollo, preproduccion, produccion]

jobs:
  verificar:
    name: Instalar, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  dependencias:
    name: Dependencias sin vulnerabilidades altas ni criticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Lo que va en el paquete final (sin las herramientas de desarrollo): falla con una vulnerabilidad
      # alta o critica. Las de desarrollo no llegan al navegador.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  imagenes-fijadas:
    name: Imagenes base fijadas por digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sin red: solo mira que ningun "FROM" haya vuelto a quedar con una etiqueta a secas (SCRUM-214). Si el digest
      # esta al dia lo dice scripts/actualizar-imagenes-base.sh --ver, que se corre a mano.
      - run: bash scripts/comprobar-imagenes-fijadas.sh
